; DMX over WiFi (Mark II) - C++ / PlatformIO firmware.
;
; Four build environments:
;   s2mini            ESP32-S2 (Wemos/Lolin S2 Mini), full web UI      <- primary
;   s2mini_headless   ESP32-S2, REST API + MQTT + DMX, no served UI
;   d1mini            ESP8266 (Wemos D1 mini), full web UI             <- BETA
;   d1mini_headless   ESP8266, REST API + MQTT + DMX, no served UI     <- BETA
;
; The ESP8266 targets are beta: they compile, and nothing since the C++ rewrite
; has ever been run on the hardware. Wired Ethernet is ESP32-only and compiles to
; nothing there. RAM sits near half full before a single client connects, so the
; websocket and several browsers at once are the things to watch first.
;
; Flash firmware:   pio run -e s2mini -t upload
; Flash web assets: pio run -e s2mini -t uploadfs   (LittleFS image from fsdata/)
; Serial monitor:   pio device monitor
;
; uploadfs also seeds the board's config from .env, and erases everything the
; board had saved on LittleFS. Export the live config first if you need it. It
; is no longer needed to update the UI: that lives in the firmware.

[platformio]
default_envs = s2mini
data_dir = fsdata

[env]
framework = arduino
monitor_speed = 115200
; Three build steps, run before anything is compiled or packed:
;   dev_env        dev.env into -D defines. Committed, and the one place to
;                  change the version, the hotspot name and password, the
;                  default hostname and the DMX pins.
;   pack_web       web/*.{html,css,js} into one gzipped page, emitted as C
;                  arrays in src/web_assets.cpp. The UI rides inside the
;                  firmware so an over-the-air update carries the page and the
;                  code that serves it together.
;   env_to_fsdata  the local .env into fsdata/data/*.json, so a freshly flashed
;                  board comes up with your WiFi, DMX pins and hotspot already
;                  set. No .env means no seeding and the firmware falls back to
;                  the dev.env defaults. See .env.example.
extra_scripts =
	pre:tools/dev_env.py
	pre:tools/pack_web.py
	pre:tools/env_to_fsdata.py
lib_deps =
	bblanchon/ArduinoJson@^7.2.0
	knolleary/PubSubClient@^2.8
	links2004/WebSockets@^2.4.1

; ---- shared board bases (pulled in via extends) ----

; The platform version is pinned on purpose. espressif32 7.x ships arduino-esp32
; 3.3.x (ESP-IDF 5.5), which dropped the uart_signal_conn_t::module field that
; esp_dmx still uses, so the library no longer builds there. 6.9.0 gives
; arduino-esp32 2.0.17 (ESP-IDF 4.4), the combination esp_dmx 4.1.0 was released
; against. Revisit if esp_dmx ever picks up IDF 5.4+ support.
[esp32base]
platform = espressif32@6.9.0
board = lolin_s2_mini
board_build.filesystem = littlefs

[esp8266base]
platform = espressif8266
board = d1_mini
board_build.filesystem = littlefs

; ---- ESP32-S2 : primary target ----

[env:s2mini]
extends = esp32base
; ARDUINO_USB_CDC_ON_BOOT routes the serial console to the S2's native USB port.
; FW_TARGET names this build, and with it the release asset that fits this board.
build_flags = -D WITH_WEBUI=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D FW_TARGET=\"s2mini\"
lib_deps =
	${env.lib_deps}
	someweisguy/esp_dmx@^4.1.0
	arduino-libraries/Ethernet@^2.0.2

[env:s2mini_headless]
extends = esp32base
build_flags = -D WITH_WEBUI=0 -D ARDUINO_USB_CDC_ON_BOOT=1 -D FW_TARGET=\"s2mini-headless\"
lib_deps =
	${env.lib_deps}
	someweisguy/esp_dmx@^4.1.0
	arduino-libraries/Ethernet@^2.0.2

; ---- ESP8266 : range extension ----
; ESPDMX drives DMX on Serial1/GPIO2 and is ESP8266-only; keep it off the ESP32
; environments above.

[env:d1mini]
extends = esp8266base
build_flags = -D WITH_WEBUI=1 -D FW_TARGET=\"d1mini\"
lib_deps =
	${env.lib_deps}
	https://github.com/Rickgg/ESP-Dmx.git

[env:d1mini_headless]
extends = esp8266base
build_flags = -D WITH_WEBUI=0 -D FW_TARGET=\"d1mini-headless\"
lib_deps =
	${env.lib_deps}
	https://github.com/Rickgg/ESP-Dmx.git
