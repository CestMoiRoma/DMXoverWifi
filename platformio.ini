; DMX over WiFi (Mark II) - C++ / PlatformIO firmware.
;
; Four build environments:
;   s2mini            ESP32-S2 (Wemos/Lolin S2 Mini), full web UI      <- primary
;   s2mini_headless   ESP32-S2, REST API + MQTT + DMX, no served UI
;   d1mini            ESP8266 (Wemos D1 mini), full web UI
;   d1mini_headless   ESP8266, REST API + MQTT + DMX, no served UI
;
; Flash firmware:   pio run -e s2mini -t upload
; Flash web assets: pio run -e s2mini -t uploadfs   (LittleFS image from fsdata/)
; Serial monitor:   pio device monitor

[platformio]
default_envs = s2mini
data_dir = fsdata

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^7.2.0
	knolleary/PubSubClient@^2.8

; ---- shared board bases (pulled in via extends) ----

[esp32base]
platform = espressif32
board = lolin_s2_mini
board_build.filesystem = littlefs

[esp8266base]
platform = espressif8266
board = d1_mini
board_build.filesystem = littlefs

; ---- ESP32-S2 : primary target ----

[env:s2mini]
extends = esp32base
; ARDUINO_USB_CDC_ON_BOOT routes the serial console to the S2's native USB port.
build_flags = -D WITH_WEBUI=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:s2mini_headless]
extends = esp32base
build_flags = -D WITH_WEBUI=0 -D ARDUINO_USB_CDC_ON_BOOT=1

; ---- ESP8266 : range extension ----

[env:d1mini]
extends = esp8266base
build_flags = -D WITH_WEBUI=1

[env:d1mini_headless]
extends = esp8266base
build_flags = -D WITH_WEBUI=0
